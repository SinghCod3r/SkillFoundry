name: 🐛 Bug Report
description: Create a report to help us improve SkillFoundry
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: SkillFoundry Version
      description: Which version of SkillFoundry are you using? (Run `skillfoundry --version`)
      placeholder: e.g., 0.1.0
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: LLM Provider
      description: Which provider were you using when the issue occurred?
      placeholder: e.g., openai, anthropic, google
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug? Please include command-line arguments if applicable.
      value: |
        1. Run command '...'
        2. With configuration '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Paste any relevant logs, tracebacks, or terminal output here. (Use the `--verbose` flag if possible).
      render: shell
