name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.actor }}
          # Set GH_PACKAGES_TOKEN to a classic PAT with write:packages.
          TWINE_PASSWORD: ${{ secrets.GH_PACKAGES_TOKEN }}
          TWINE_REPOSITORY_URL: https://pip.pkg.github.com/${{ github.repository_owner }}
        run: python -m twine upload dist/*
