        :root {

            --radius: 6px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

        @media (prefers-color-scheme: dark) {

                --text-light: #9ca3af;
                --border: #374151;
            }
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 2rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        h1, h2, h3, h4 {
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .header-meta {
            color: var(--text-light);
            font-size: 0.9rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg);
        }

        .score-container {
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        .score-large {
            font-size: 3rem;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .score-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            text-align: center;
        }

        .score-card .label {
            font-size: 0.875rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-card .value {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .score-green { color: var(--score-green); }
        .score-yellow { color: var(--score-yellow); }
        .score-red { color: var(--score-red); }

        pre, code {
            font-family: var(--font-mono);
            font-size: 0.875em;
            background: var(--border);
            border-radius: 4px;
            padding: 0.2em 0.4em;
        }

        pre {
            padding: 1rem;
            overflow-x: auto;
            background: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            pre {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        details {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.5rem;
        }

        summary {
            padding: 1rem;
            cursor: pointer;
            font-weight: 500;
        }

        details > div {
            padding: 1rem;
            border-top: 1px solid var(--border);
        }

        .task-success { border-left: 4px solid var(--score-green); }
        .task-failure { border-left: 4px solid var(--score-red); }

        .list-unstyled {
            list-style: none;
            padding-left: 0;
        }

        .list-unstyled li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }
        .list-unstyled li:last-child {
            border-bottom: none;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        @media print {
            body {
                color: black;
                background: white;
            }
            .card {
                break-inside: avoid;
            }
        }
    </style>
</head>
